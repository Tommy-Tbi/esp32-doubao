## Standalone SparkBot USB speaker + microphone firmware.
## No WiFi/cloud protocol, speech model, AFE, Opus or camera dependencies.
dependencies:
  espressif/esp_codec_dev: ~1.5
  lvgl/lvgl: ~9.3.0
  espressif/esp_lvgl_port: ~2.6.0
  78/xiaozhi-fonts: ~1.5.5
  espressif/button: ~4.1.3
  espressif/esp_tinyusb:
    version: "^1.4.0"
    rules:
      - if: "target == esp32s3"
  espressif/tinyusb:
    version: "~0.17.0"
    rules:
      - if: "target == esp32s3"
  idf:
    version: '>=5.4.0'
